	<!--
	  Local dev: node build --dev  → testclient.html, then npx serve -p 8082 -c serve.json
	  Deploy:     node build        → index.html (uses config/config.js)
	-->
	<meta charset="utf-8" />
	<base href="/">

	<title>Pok&eacute;dex - Pok&eacute;mon Showdown</title>

	<meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=IE8" />
	<link rel="stylesheet" href="https://play.pokemonshowdown.com/style/font-awesome.css" />

	<!--[if IE 7]><style> li.tree { zoom: 1; } </style><![endif]-->

</head><body>

	<div class="pfx-topbar">
		<div class="header">
			<!-- The fork's own sites first, then Smogon's, then this repo. Play is a separate `nav-play`
			     list, as the upstream dex has it: `.header .nav-play` in theme/panels.css gives it its
			     own padding, and `.nav .button { border-radius: 0 }` does not reach it, so it keeps the
			     default rounded `.button` shape on all four corners. -->
			<ul class="nav">
				<li><a class="button nav-first" href="http://localhost:8081/play.pokemonshowdown.com/testclient-old?~~localhost:8000"><img src="/images/pokemonshowdownbeta.png" alt="Pok&eacute;mon Showdown! (beta)" /> Home</a></li>
				<li><a class="button cur" href="/">Pok&eacute;dex</a></li>
				<li><a class="button" href="http://localhost:8081/analysis.pokemonshowdown.com/?~~localhost:8002">Analysis</a></li>
				<li><a class="button" href="https://smogon.com/dex/">Strategy</a></li>
				<li><a class="button" href="https://smogon.com/forums/">Forum</a></li>
				<li><a class="button nav-last" href="https://github.com/chchristie/pokemon-showdown-dex">GitHub</a></li>
			</ul>
			<!-- The gear is its own list rather than part of `nav-play`, which the narrow-screen rule
			     hides: the mod switcher has to stay reachable at every width. -->
			<ul class="nav-settings">
				<li><button class="button dexsettings-button" name="dexsettings" aria-label="Settings" title="Settings"><i class="fa fa-cog" aria-hidden="true"></i></button></li>
			</ul>
			<ul class="nav-play">
				<li><a class="button greenbutton" href="http://localhost:8081/play.pokemonshowdown.com/testclient-old?~~localhost:8000">Play</a></li>
			</ul>
			<div style="clear:both"></div>
		</div>
	</div>
	<div class="pfx-panel"><div class="pfx-body">
		<noscript><p>
			<strong>Requires JavaScript!</strong>
		</p></noscript>
		<p>
			Loading...
		</p>
